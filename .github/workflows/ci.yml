name: 🔒 CI/CD Pipeline - متجر الأطفال

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # ===== مرحلة الاختبارات =====
  tests:
    name: 🧪 اختبارات PHP و Laravel
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: [8.1, 8.2]
        
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: kids_store_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis, mysql
        coverage: xdebug

    - name: 📦 Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ~/.composer/cache/files
        key: dependencies-composer-${{ hashFiles('composer.json') }}

    - name: 🎼 Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: 📁 Create storage directories
      run: |
        mkdir -p storage/logs
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        mkdir -p storage/framework/views
        mkdir -p bootstrap/cache

    - name: ⚙️ Setup environment
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan config:clear
        php artisan cache:clear

    - name: 🗄️ Run database migrations
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: kids_store_test
        DB_USERNAME: root
        DB_PASSWORD: password
      run: |
        php artisan migrate --force
        php artisan db:seed --force

    - name: 🧪 Run PHPUnit tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: kids_store_test
        DB_USERNAME: root
        DB_PASSWORD: password
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379
      run: php artisan test --coverage --min=80

    - name: 🔒 Run security audit
      run: php artisan security:audit

    - name: ⚡ Run performance tests
      run: php artisan optimize:performance

  # ===== مرحلة فحص الكود =====
  code-quality:
    name: 🎨 فحص جودة الكود
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.1
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

    - name: 🎼 Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: 📏 Run PHP CS Fixer
      run: |
        composer require --dev friendsofphp/php-cs-fixer
        ./vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

    - name: 🔍 Run PHPStan
      run: |
        composer require --dev phpstan/phpstan
        ./vendor/bin/phpstan analyse --memory-limit=2G

    - name: 🛡️ Run security checker
      run: |
        composer require --dev sensiolabs/security-checker
        ./vendor/bin/security-checker security:check

  # ===== مرحلة بناء الأصول =====
  assets:
    name: 🎨 بناء الأصول
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install NPM dependencies
      run: npm ci

    - name: 🏗️ Build assets
      run: npm run build

    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: built-assets
        path: public/build/

  # ===== مرحلة النشر =====
  deploy:
    name: 🚀 النشر للإنتاج
    runs-on: ubuntu-latest
    needs: [tests, code-quality, assets]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📤 Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: built-assets
        path: public/build/

    - name: 🚀 Deploy to production
      run: |
        echo "🚀 Deploying to production server..."
        echo "✅ Deployment completed successfully!"
        # هنا يمكن إضافة أوامر النشر الفعلية

  # ===== مرحلة الإشعارات =====
  notify:
    name: 📢 الإشعارات
    runs-on: ubuntu-latest
    needs: [tests, code-quality, assets]
    if: always()
    
    steps:
    - name: 📧 Send notification
      run: |
        if [ "${{ needs.tests.result }}" == "success" ] && [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "✅ جميع الاختبارات نجحت!"
        else
          echo "❌ فشل في بعض الاختبارات"
        fi
