; PHP Configuration for Kids Store E-commerce Production
; Place relevant sections in your php.ini or create separate .ini files in conf.d/
; Author: Hudhaifa Al-Hudhaifi

[PHP]
; Basic Settings
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
disable_classes =
zend.enable_gc = On
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Miscellaneous
expose_php = Off
max_execution_time = 60
max_input_time = 60
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 20M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"
include_path = ".:/usr/share/php"
doc_root =
user_dir =
enable_dl = Off
file_uploads = On
upload_max_filesize = 20M
max_file_uploads = 20
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60

; Error Logging
log_errors_max_len = 1024
error_log = /var/log/php/error.log

; Data Handling
arg_separator.output = "&"
arg_separator.input = "&"
auto_append_file =
auto_prepend_file =

; Paths and Directories
doc_root =
user_dir =
extension_dir = "/usr/lib/php/20220829"
sys_temp_dir = "/tmp"

; File Uploads
file_uploads = On
upload_tmp_dir = /tmp
upload_max_filesize = 20M
max_file_uploads = 20

; Fopen wrappers
allow_url_fopen = On
allow_url_include = Off
user_agent = "PHP"
default_socket_timeout = 60
auto_detect_line_endings = Off

; Dynamic Extensions
extension = bcmath
extension = ctype
extension = curl
extension = dom
extension = fileinfo
extension = filter
extension = gd
extension = hash
extension = iconv
extension = intl
extension = json
extension = libxml
extension = mbstring
extension = mysqli
extension = mysqlnd
extension = openssl
extension = pcre
extension = pdo
extension = pdo_mysql
extension = phar
extension = posix
extension = readline
extension = redis
extension = reflection
extension = session
extension = simplexml
extension = sockets
extension = sodium
extension = spl
extension = standard
extension = tokenizer
extension = xml
extension = xmlreader
extension = xmlwriter
extension = zip
extension = zlib

; Session Configuration
session.save_handler = redis
session.save_path = "tcp://127.0.0.1:6379?database=2"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.serialize_handler = php
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 7200
session.referer_check =
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0
session.sid_length = 26
session.trans_sid_tags = "a=href,area=href,frame=src,form="
session.sid_bits_per_character = 5

; Security Settings
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Strict

; OPcache Configuration
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 5
opcache.use_cwd = 1
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.revalidate_path = 0
opcache.save_comments = 0
opcache.fast_shutdown = 1
opcache.enable_file_override = 0
opcache.optimization_level = 0x7FFFBFFF
opcache.inherited_hack = 1
opcache.dups_fix = 0
opcache.blacklist_filename = /etc/php/8.2/opcache-blacklist.txt

; JIT Configuration (PHP 8.0+)
opcache.jit_buffer_size = 100M
opcache.jit = tracing

; Realpath Cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; MySQL Configuration
mysqli.max_persistent = -1
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.default_port = 3306
mysqli.default_socket = /var/run/mysqld/mysqld.sock
mysqli.default_host =
mysqli.default_user =
mysqli.default_pw =
mysqli.reconnect = Off

; PDO Configuration
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock

; Date/Time Configuration
date.timezone = "Asia/Riyadh"

; Mail Configuration
SMTP = localhost
smtp_port = 25
mail.add_x_header = Off

; Resource Limits
max_execution_time = 60
max_input_time = 60
max_input_nesting_level = 64
max_input_vars = 3000
memory_limit = 512M

; Error Handling
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
html_errors = Off
error_log = /var/log/php/error.log

; Data Limits
post_max_size = 20M
upload_max_filesize = 20M
max_file_uploads = 20

; Performance Tuning
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
open_basedir = /var/www/kids-store:/tmp:/var/tmp:/usr/share/php

; Logging
log_errors = On
error_log = /var/log/php/kids-store-error.log
syslog.ident = kids-store-php
